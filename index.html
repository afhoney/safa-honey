<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#252052">
    <meta name="description" content="عسل صفا — موقعنا وحساباتنا وطرق التواصل في مكان واحد.">
    <title>
      عسل صفا | Safa Honey
    </title>
    <!-- الألوان وتنسيق الصفحة والجوال -->
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap');
    :root {
      --navy:#252052;
      --orange:#fc961f;
      --paper:#fbf8f1;
      --muted:#777284;
    }
    * {
      box-sizing:border-box;
    }
    body {
      margin:0;
      background:var(--paper);
      color:var(--navy);
      font-family:Tajawal,Tahoma,Arial,sans-serif;
    }
    button {
      font:inherit;
      cursor:pointer;
      color:inherit;
    }
    button:focus-visible {
      outline:3px solid var(--orange);
      outline-offset:5px;
    }
    .page {
      min-height:100svh;
      max-width:1440px;
      margin:auto;
      padding:34px 7vw 22px;
      position:relative;
      overflow:hidden;
    }
    .top {
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:11px;
      letter-spacing:3px;
      direction:ltr;
    }
    .top .mark {
      display:flex;
      gap:9px;
      align-items:center;
    }
    .hex {
      width:12px;
      height:14px;
      background:var(--orange);
      clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
    }
    .top-ar {
      letter-spacing:0;
      font-size:13px;
    }
    .layout {
      min-height:calc(100svh - 116px);
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9%;
      align-items:center;
      padding:45px 0;
    }
    .identity {
      position:relative;
      text-align:center;
      padding:45px 25px;
    }
    .identity:before {
      content:'';
      position:absolute;
      inset:0 0 55px;
      background:linear-gradient(140deg,#f6e9d0,#f8efdd 55%,#fcf8f0);
      clip-path:polygon(50% 0,94% 24%,94% 75%,50% 100%,6% 75%,6% 24%);
      z-index:-1;
    }
    .logo {
      width:225px;
      max-width:70%;
      height:auto;
      display:block;
      margin:0 auto 28px;
      mix-blend-mode:multiply;
    }
    .identity h1 {
      font-size:32px;
      font-weight:500;
      margin:22px 0 12px;
    }
    .identity p {
      font-size:15px;
      color:#7b705e;
      line-height:1.9;
      margin:0;
    }
    .orbit {
      position:absolute;
      width:27px;
      height:30px;
      clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
      background:var(--orange);
      top:20%;
      right:4%;
      transform:rotate(10deg);
    }
    .orbit.two {
      top:68%;
      right:auto;
      left:2%;
      width:17px;
      height:20px;
      background:var(--navy);
    }
    .eyebrow {
      display:flex;
      align-items:center;
      gap:10px;
      font-size:12px;
      color:#8c7b64;
      margin-bottom:12px;
    }
    .eyebrow:before {
      content:'';
      width:24px;
      height:1px;
      background:var(--orange);
    }
    h2 {
      font-size:27px;
      margin:0 0 25px;
      font-weight:700;
    }
    .website {
      width:100%;
      border:0;
      border-radius:16px;
      background:var(--navy);
      color:white;
      padding:23px 22px;
      display:flex;
      align-items:center;
      gap:16px;
      text-align:right;
      box-shadow:0 10px 25px #25205214;
      transition:transform .2s,background .2s;
    }
    .website:hover {
      transform:translateY(-3px);
      background:#342b69;
    }
    svg {
      width:24px;
      height:24px;
      flex-shrink:0;
    }
    .website .web-icon {
      width:46px;
      height:46px;
      background:#ffffff10;
      border:1px solid #ffffff20;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:#ffb352;
    }
    .website strong {
      font-size:19px;
      display:block;
    }
    .website small {
      display:block;
      margin-top:6px;
      color:#d4cfe6;
      font-size:12px;
    }
    .arrow {
      margin-right:auto;
      direction:ltr;
      font-family:Arial;
      font-size:22px;
      font-weight:400;
    }
    .website .arrow {
      color:#ffb352;
    }
    .section-label {
      display:flex;
      align-items:center;
      gap:12px;
      color:#8e8491;
      font-size:12px;
      margin:28px 0 15px;
    }
    .section-label:after {
      content:'';
      height:1px;
      background:#e8e1d8;
      flex:1;
    }
    .socials {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    .social {
      display:flex;
      align-items:center;
      gap:12px;
      text-align:right;
      background:#fffdf8;
      border:1px solid #e8e1d8;
      border-radius:13px;
      padding:18px 15px;
      transition:transform .2s,border-color .2s,background .2s;
    }
    .social:hover {
      transform:translateY(-3px);
      border-color:var(--orange);
      background:#fff7e9;
    }
    .social strong {
      display:block;
      font-size:15px;
      font-weight:600;
    }
    .social small {
      display:block;
      font-size:10px;
      letter-spacing:.5px;
      color:var(--muted);
      margin-top:6px;
    }
    .social .arrow {
      font-size:16px;
      color:#a69ca4;
    }
    .social-icon {
      display:flex;
    }
    .contact {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:26px;
      padding-top:22px;
      border-top:1px solid #e8e1d8;
    }
    .contact button {
      border:0;
      padding:5px 0;
      background:none;
      display:flex;
      text-align:right;
      align-items:center;
      gap:11px;
    }
    .contact svg {
      width:19px;
      color:#a5875f;
    }
    .contact strong {
      display:block;
      font-size:12px;
      font-weight:500;
    }
    .contact small {
      display:block;
      font-size:11px;
      color:#948b90;
      margin-top:5px;
    }
    footer {
      direction:ltr;
      display:flex;
      justify-content:space-between;
      gap:15px;
      border-top:1px solid #e8e1d8;
      padding-top:18px;
      color:#999095;
      font-size:10px;
      letter-spacing:1px;
    }
    footer span:last-child {
      letter-spacing:0;
    }
    dialog {
      border:1px solid #eee3d2;
      border-radius:22px;
      padding:35px 28px;
      background:var(--paper);
      color:var(--navy);
      text-align:center;
      width:min(360px,90vw);
      box-shadow:0 20px 80px #17122a33;
    }
    dialog::backdrop {
      background:#17122a88;
      backdrop-filter:blur(5px);
    }
    dialog .hex {
      margin:0 auto 20px;
      width:32px;
      height:36px;
    }
    dialog h2 {
      margin:0 0 12px;
      font-size:26px;
    }
    dialog p {
      font-size:14px;
      line-height:1.8;
      color:var(--muted);
    }
    dialog button {
      border:0;
      border-radius:9px;
      background:var(--navy);
      color:white;
      padding:12px 36px;
      margin-top:10px;
    }
    .layout {
      animation:enter .7s ease both;
    }
    @keyframes enter {
      from {
        opacity:0;
        transform:translateY(12px);
      }
      to {
        opacity:1;
        transform:none;
      }
    }
    @media(min-width:1500px) {
      .page {
        padding-left:100px;
        padding-right:100px;
      }
    }
    @media(max-width:760px) {
      .page {
        padding:22px 24px 20px;
      }
      .top {
        font-size:9px;
        letter-spacing:2px;
      }
      .top-ar {
        font-size:11px;
      }
      .layout {
        display:block;
        padding:26px 0 30px;
        min-height:0;
      }
      .identity {
        padding:25px 15px 26px;
        max-width:360px;
        margin:0 auto 27px;
      }
      .identity:before {
        inset:0 25px 30px;
      }
      .logo {
        width:135px;
        margin-bottom:16px;
      }
      .identity h1 {
        font-size:24px;
        margin:14px 0 6px;
      }
      .identity p {
        font-size:12px;
      }
      .orbit {
        right:7%;
        width:17px;
        height:20px;
      }
      .orbit.two {
        left:7%;
        width:12px;
        height:14px;
      }
      .eyebrow {
        font-size:10px;
        margin-bottom:9px;
      }
      h2 {
        font-size:23px;
        margin-bottom:18px;
      }
      .website {
        padding:19px 17px;
      }
      .website strong {
        font-size:17px;
      }
      .website small {
        font-size:11px;
      }
      .social {
        padding:17px 12px;
        gap:10px;
      }
      .social strong {
        font-size:14px;
      }
      .social svg {
        width:21px;
      }
      .section-label {
        margin-top:23px;
      }
      .contact {
        margin-top:23px;
      }
      footer {
        font-size:8px;
      }
    }
    @media(prefers-reduced-motion:reduce) {
      * {
        animation:none!important;
        transition:none!important;
      }
    }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="top">
        <span class="mark">
          <i class="hex">
          </i>
          SAFA HONEY
        </span>
        <span class="top-ar">
          عسل صفا
        </span>
      </header>
      <main class="layout">
        <section class="identity" aria-label="عسل صفا">
          <span class="orbit" aria-hidden="true">
          </span>
          <span class="orbit two" aria-hidden="true">
          </span>
          <img class="logo" src="logo.png" alt="شعار عسل صفا" width="360" height="422">
          <h1>
            صفا… يحلّي جمعتكم
          </h1>
          <p>
            يا هلا فيك، نورت صفا 🤍
            <br>
            تعرّف على عسلنا، وخلّنا قريبين منك
          </p>
        </section>
        <section class="links" aria-label="روابط صفا">
          <div class="eyebrow">
            روابطنا
          </div>
          <h2>
            من هنا تبدأ الحكاية
          </h2>
          <button class="website" data-name="الموقع الإلكتروني">
            <span class="web-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                  <path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z"/>
                  </svg>
                </span>
                <span>
                  <strong>
                    اكتشف أنواع صفا
                  </strong>
                  <small>
                    موقعنا الإلكتروني · تعرّف علينا وعلى منتجاتنا
                  </small>
                </span>
                <span class="arrow">
                  ↗
                </span>
              </button>
              <div class="section-label">
                نلتقي على
              </div>
              <div class="socials">
                <button class="social" data-name="تيك توك">
                  <span class="social-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M14 3v12a5 5 0 1 1-4-4v3a2 2 0 1 0 1 2V3h3c.5 3 2.5 5 6 5v3c-2 0-4-1-6-2"/>
                      </svg>
                    </span>
                    <span>
                      <strong>
                        تيك توك
                      </strong>
                      <small>
                        TikTok
                      </small>
                    </span>
                    <span class="arrow">
                      ↗
                    </span>
                  </button>
                  <button class="social" data-name="إنستغرام">
                    <span class="social-icon">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="5"/>
                          <circle cx="12" cy="12" r="4"/>
                            <circle cx="17.5" cy="6.5" r=".7" fill="currentColor" stroke="none"/>
                            </svg>
                          </span>
                          <span>
                            <strong>
                              إنستغرام
                            </strong>
                            <small>
                              Instagram
                            </small>
                          </span>
                          <span class="arrow">
                            ↗
                          </span>
                        </button>
                        <button class="social" data-name="سناب شات">
                          <span class="social-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                              <path d="M12 3c-4 0-5 3-5 6v2l-2-1-1 2 3 2c-.5 2-2 3-4 4l4 1 1 2 4-1 4 1 1-2 4-1c-2-1-3.5-2-4-4l3-2-1-2-2 1V9c0-3-1-6-5-6Z"/>
                              </svg>
                            </span>
                            <span>
                              <strong>
                                سناب شات
                              </strong>
                              <small>
                                Snapchat
                              </small>
                            </span>
                            <span class="arrow">
                              ↗
                            </span>
                          </button>
                          <button class="social" data-name="فيسبوك">
                            <span class="social-icon">
                              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M14 21v-8h3l.5-4H14V7c0-1 .5-2 2-2h2V2h-3c-4 0-5 2-5 5v2H7v4h3v8"/>
                                </svg>
                              </span>
                              <span>
                                <strong>
                                  فيسبوك
                                </strong>
                                <small>
                                  Facebook
                                </small>
                              </span>
                              <span class="arrow">
                                ↗
                              </span>
                            </button>
                          </div>
                          <div class="contact">
                            <button data-name="رقم الجوال">
                              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="m8 3 3 5-3 2c1 3 3 5 6 6l2-3 5 3c0 3-2 5-4 5C10 21 3 14 3 7c0-2 2-4 5-4Z"/>
                                </svg>
                                <span>
                                  <strong>
                                    رقم الجوال
                                  </strong>
                                  <small>
                                    قيد الإنشاء
                                  </small>
                                </span>
                              </button>
                              <button data-name="البريد الإلكتروني">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                  <rect x="3" y="5" width="18" height="14" rx="3"/>
                                    <path d="m3 7 9 6 9-6"/>
                                    </svg>
                                    <span>
                                      <strong>
                                        البريد الإلكتروني
                                      </strong>
                                      <small>
                                        قيد الإنشاء
                                      </small>
                                    </span>
                                  </button>
                                </div>
                              </section>
                            </main>
                            <footer>
                              <span>
                                SAFA HONEY © 2026
                              </span>
                              <span>
                                عسل صفا · كل الحقوق محفوظة
                              </span>
                            </footer>
                          </div>
                          <dialog aria-labelledby="modal-title">
                            <div class="hex">
                            </div>
                            <h2 id="modal-title">
                              قيد الإنشاء
                            </h2>
                            <p id="modal-text">
                            </p>
                            <button id="close-modal" autofocus>
                              حسنًا
                            </button>
                          </dialog>
                          <!-- تفاعلات الأزرار ونافذة قيد الإنشاء -->
    <script>
                          // فتح رسالة قيد الإنشاء عند الضغط على أي رابط.
    const modal = document.querySelector('dialog');

    document.querySelectorAll('[data-name]').forEach(button => {
      button.addEventListener('click', () => {
        document.getElementById('modal-text').textContent =
          button.dataset.name + ' قيد التجهيز حاليًا. يسعدنا لقاؤك قريبًا.';
        modal.showModal();
      });
    });

    // إغلاق النافذة بزر حسنًا.
    document.getElementById('close-modal').addEventListener('click', () => {
      modal.close();
    });

    // إغلاق النافذة عند الضغط خارجها.
    modal.addEventListener('click', e => {
      if (e.target === modal) {
        const r = modal.getBoundingClientRect();
        if (
          e.clientX < r.left || e.clientX > r.right ||
          e.clientY < r.top || e.clientY > r.bottom
        ) {
          modal.close();
        }
      }
    });
                          </script>
                        </body>
                      </html>
